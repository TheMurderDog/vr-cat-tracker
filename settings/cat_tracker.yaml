# Cat tracker settings. Cameras, lens and room calibration, and the headset-to-head offset are read
# from settings/cameras.yaml and my_data/calibration (never written by the cat tracker); only what is
# cat-specific lives here. Paths are relative to the top folder (the one with 0_start_here in it).

logging:
  dir: my_data/logs/cat_tracker  # the cat tracker's own logs, so the core's logs are never pruned or mixed
  console_level: INFO
  file_level: DEBUG
  keep_last: 50

cameras:                    # overrides of settings/cameras.yaml's camera settings, for the cat tracker's runs only
  fps: full                 # full = the cameras' normal speed. Leave as is (developers: see docs/technical)
  # exposure_ms: 7.8        # a fixed exposure keeps cameras matched. The reference setup uses 7.8 ms, twice the 3.9 ms
                            # its body tracking uses: a cat needs light more than sharpness. Unset = the settings/cameras.yaml setting
                            # (automatic by default)

reset_white_balance: true   # with a fixed white_balance_k: at start, toggle auto white balance on and off, then set it again
                            # (some drivers keep an old value otherwise). Does nothing when white balance is automatic

detector:                   # the stock COCO model to start (cats are class 15; 3_first_test\1_get_stock_model.bat gets it).
                            # Train it on YOUR cat (4_teach_it_your_cat); 3_train.bat then switches this to
                            #   model: my_data/models/cat_finetuned_half.onnx  and  cat_class: 0
  model: my_data/models/yolo11s.onnx
  input: 960                # long side fed to the model (1280x720 -> 960x544); 640 missed small cats in tests, 1280 is slower
  cat_class: 15
  score: 0.2                # lowest confidence that counts as a cat; the room and height checks and confirm_frames
                            # weed out the extra false hits this lets in
  weak_score: 0.08          # weaker boxes still count where it's expected: next to another camera's sighting
                            # or where it just was (cuts flicker, gets more cameras to triangulate)
  gamma: 1.0                # below 1 brightens shadows before detection (try 0.8 if a camera is still dark)
  nms_iou: 0.5
  min_box_px: 12            # boxes smaller than this (in the full frame) are ignored
  rate_hz: 8                # detections per second while it's moving or close to you (all four cameras in one GPU run)
  idle_rate_hz: 3           # ...and while it's still, asleep or out of the room, which is most of the time.
                            # Its marker still follows your head smoothly either way, see overlay.update_hz
  tripwire_change: 6.0      # at the idle rate, its spot is checked 30 times a second between detections: this
                            # much change (grey levels) runs the detector at once (a sudden start isn't missed)
  full_rate_within_m: 3.0   # this close to you: the full rate, still or not

locate:
  min_views: 2              # cameras that must agree to triangulate it
  max_reprojection_px: 40   # box centres seen from different sides are not the exact same point, so this is loose
  floor_y_m: 0.0            # floor height in calibration space (room.json was solved in SteamVR standing space)
  body_height_m: 0.15       # height of a cat's middle when only one camera sees it (placed on the floor)
  floor_depth_m: 0.2        # with one camera, its middle is this much further away than the bottom edge of its box
  max_height_m: 1.0         # higher than this (top of a dresser or desk) is a picture on the wall, not the cat
  room_margin_m: 0.15       # the room = the box around the four cameras plus this
  outline_radius_m: 0.22    # its outline when projecting where it should appear in a camera: a cylinder this wide...
  outline_half_height_m: 0.15  # ...and twice this tall
  weak_iou: 0.3             # how much a weak box must overlap that outline to count
  partial_ratio: 0.6        # with 3+ cameras: a box under this share of a cat's size there (part of it hidden) counts
                            # less in the position; 0 = off

filter:
  min_cutoff: 1.0           # One Euro filter (the camera code's): lower = steadier, more lag
  beta: 0.8                 # higher = less lag when it runs
  d_cutoff: 1.0
  max_jump_m: 1.0           # a position this far from the last one is ignored as a mistake...
  jump_accept_after: 2      # ...unless it repeats this many detections in a row
  confirm_frames: 2         # detections in a row before it is shown (guards against one-off false hits; 0.4 s at 5 Hz)
  lost_after_s: 1.0         # no detection for this long: it is "last seen" and its marker dims
  fade_s: 8.0               # the last-seen marker fades out over this long, then hides

anchor:                     # lines camera space up with SteamVR's raw tracking space (unaffected by play space moves)
  file: my_data/tracker/anchor.json
  samples: 300              # head sightings (headset on, cameras seeing you) to collect
  min_spread_m: 0.8         # you must walk around at least this far, or the turn of the room can't be pinned down
  timeout_s: 90
  max_residual_m: 0.06      # median fit error above this is reported as a bad anchor

overlay:
  icon: engine/cat_tracker/assets/cat.png
  icon_close: engine/cat_tracker/assets/cat_close.png
  icon_rest: engine/cat_tracker/assets/cat_rest.png    # still for rest_after_s: eyes closed, z z (CatState 1 in VRChat)
  icon_move: engine/cat_tracker/assets/cat_move.png    # moving at move_speed or faster
  rest_after_s: 120         # 2 minutes still before it counts as asleep (was 20 s)
  move_speed: 0.2           # m/s: faster than this for move_start_s and it's moving (CatState 2)...
  move_start_s: 0.4
  move_stop_speed: 0.12     # ...until it's slower than this for move_stop_s (two thresholds, so jitter can't flicker it)
  move_stop_s: 1.0
  smooth_s: 0.15            # its marker and the snake ease toward each new detection over about this long
  still_speed: 0.1          # below this it counts as still (m/s)
  speed_window_s: 1.0       # its speed is how far it got over this long
  heading_window_s: 1.5     # its heading (VRChat CatRoomYaw) compares where it was this long ago with now
  heading_min_move_m: 0.08  # ...and only turns once it has covered this much (averaged, so jitter cancels);
                            # lower = turns on slower walks, but too low lets a still cat's jitter turn it
  heading_smooth_s: 0.3     # then eases toward the new direction over about this long
  ring: engine/cat_tracker/assets/ring.png
  icon_width_m: 0.28
  icon_lift_m: 0.30         # icon floats this far above its middle, so it isn't hidden in the floor
  ring_width_m: 0.55        # flat ring on the floor under it
  lost_alpha: 0.6           # brightness of the last-seen marker when it starts fading
  update_hz: 30             # how often the marker, edge arrow and VRChat offset are re-placed from your head pose

alert:                      # when to warn: a small arrow at the edge of your view pointing toward it, and its red icon
  underfoot_m: 1.0          # this close: warn even if it's asleep (was 0.5: too late, 2026-10-30)
  radius_m: 1.8             # this close and it's moving: warn
  ttc_s: 2.5                # it (or you) closing in fast enough to meet within this many seconds: warn early...
  max_warn_m: 4.0           # ...from up to this far away
  min_closing_speed: 0.2    # m/s; slower than this doesn't count as closing in
  still_speed: 0.15         # m/s; within radius_m but slower than this (napping) doesn't warn
  closing_smooth_s: 0.4
  buzz: true                # controller vibration once each time the warning comes on (the arrow and red icon);
                            # SteamVR Input, see input/actions.json
  buzz_pattern: LRLR        # one pulse per letter, L = left controller, R = right
  buzz_total_s: 1.0         # the whole pattern takes this long
  buzz_s: 0.15              # each pulse
  buzz_amplitude: 0.6       # 0-1
  buzz_rearm_s: 1.0         # the warning must be off this long before the next buzz, so a flicker at the edge
                            # doesn't buzz twice; while it stays close (cuddles) it stays quiet
  image: engine/cat_tracker/assets/edge_arrow.png
  edge_angle_deg: 32        # how far from the middle of your view the arrow sits (about the edge of a clear view)
  distance_m: 1.0           # the arrow is drawn this far in front of your eyes...
  width_m: 0.07             # ...and this wide (0.07 m at 1 m is about 4 degrees)
  alpha: 0.9

anchor_check:               # while running, every few minutes: is the saved anchor still right? Fixes it quietly when it can
  enabled: true
  first_after_s: 30
  every_s: 180
  recheck_s: 20             # while the anchor looks off or unconfirmed, check this often instead, until it's settled
  samples: 20               # head sightings per check (headset on, cameras seeing you)
  window_s: 20              # give up on a check after this long without enough sightings, try again later
  fix_min_m: 0.03           # off by less than this: fine, nothing to do
  fix_max_m: 0.30           # off by up to this, the same way in two checks in a row: shifted quietly to fit (no notice)
  agree_m: 0.04             # how closely those two checks must agree before it shifts
  refit_samples: 100        # off in a way a shift can't fix: redo the anchor quietly from this many sightings of your
                            # normal moving around (they must cover anchor.min_spread_m); a notice only if it can't
  max_scatter_m: 0.08       # sightings scattered more than this are ignored (someone else in view, headset not worn)
  image: engine/cat_tracker/assets/anchor_warning.png

health:                     # so that no marker only ever means "no cat", never "the tracker stopped looking"
  camera_stale_s: 2.0       # a camera with no new picture for this long: a notice in VR, and its old picture is ignored
  detector_fail_s: 3.0      # detection failing for this long: a notice in VR
  watchdog: true            # a small separate process (engine\cat_tracker\watchdog.py) that shows "CAT TRACKER STOPPED" in VR and
                            # buzzes the controllers if the tracker crashes, is killed or freezes
  hang_s: 3                 # no sign of life from the tracker for this long counts as frozen (it beats twice a second;
                            # known slow steps, like the first detections, get longer)

hard_frames:                # saves moments the model struggled with, for the next training round (see hardframes.py)
  enabled: true             # only when 2+ cameras are sure of it and another camera that should see it didn't
  every_s: 3.0              # at most one moment (4 images) this often
  max_moments: 150          # per tracker run: 600 images, about 100 to 150 MB
  min_free_gb: 10           # stop below this much free disk space
  min_sure_cameras: 2

vrchat:                     # 6_optional_vrchat\3_run_with_vrchat.bat: its position for the avatar's cat prop (see osc.py)
  host: 127.0.0.1
  port: 9000                # VRChat's OSC input
  range_m: 4.0              # CatAhead and CatRight are metres divided by this (the avatar must use the same)
  send_hz: 60               # every parameter, this often, each time with the headset pose read right then
  stick_anchor:             # EXPERIMENTAL: hold the cat's reference point still while the thumbsticks rest (stick_anchor.py)
    enabled: false          # true only with an avatar prefab that has CatAnchorMode (docs\vrchat_avatar.md)
    stick_deadzone: 0.2     # a thumbstick counts as pushed past this (0..1)
    stick_min_s: 0.1        # ...for at least this long, so a brushed stick doesn't count
    settle_s: 0.3           # after the sticks are let go, wait this long before looking for a steady head
    still_turn_dps: 15      # steady head: turning slower than this (degrees a second)...
    still_move_mps: 0.15    # ...and moving slower than this (metres a second)
    average_s: 0.5          # steady this long; the anchor is the head's average pose over it
    refresh_s: 30           # while anchored and steady, anchor again this often, for people who join later (0 = off)

capture:                    # 4_teach_it_your_cat\1_capture.bat (or c in a tracker window): frames saved in my_data/captures
  every_s: 2.0              # one frame from each camera this often (10 minutes = 1200 images)
  min_free_gb: 5            # stop capturing below this much free disk space
  enough_moments: 150       # "enough for a first model" once the cat was seen this often (a rough guide)...
  enough_spots: 3           # ...in at least this many different spots of the floor (75 cm squares)

label:                      # 4_teach_it_your_cat\2_label.bat
  cats: 1                   # boxes allowed in one picture: one per cat. A new box replaces the oldest beyond this

autolabel:                  # 4_teach_it_your_cat\2_label.bat (by itself): fill in boxes the stock model missed in a capture session
  still_m: 0.3              # two sightings closer than this...
  max_gap_s: 8.0            # ...and this close in time: it stayed put, so the moments between get its position
  radius_m: 0.22            # its outline for projecting into other cameras: a cylinder this wide...
  half_height_m: 0.15       # ...and twice this tall, around its middle
  method: crop              # crop: the stock model again on an enlarged crop where the cat should be (tight boxes;
                            # none where it finds nothing). outline: the old way, the projected outline itself
  check_below: 0.2          # crop boxes scoring under this are marked "check this" in 2_label.bat
  refine_score: 0.05        # method outline only: a weak stock-model box (this confident or more) overlapping the
  refine_iou: 0.3           # outline is used instead; 0 = off

preview:
  show_every_n: 1           # redraw the desktop window every Nth detection
  tile_height: 360
